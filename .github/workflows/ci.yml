name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/fixtures/neonatal/requirements.txt
      - run: python -m pip install -r tests/fixtures/neonatal/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:neonatal:v20 -- --maxWorkers=2
      - name: Render v20 Rujukan PDF evidence (every page)
        if: github.ref_name == 'feat/neonatal-v20-reference-box-20261104' || github.head_ref == 'feat/neonatal-v20-reference-box-20261104' || github.ref_name == 'fix/neonatal-v20-warning-catalog-20261104' || github.head_ref == 'fix/neonatal-v20-warning-catalog-20261104'
        env:
          NEONATAL_RUJUKAN_EVIDENCE_DIR: ${{ runner.temp }}/neonatal-rujukan-evidence
        run: |
          mkdir -p "$NEONATAL_RUJUKAN_EVIDENCE_DIR"
          npx vitest run src/lib/neonatal-calculator/__tests__/report-exports.test.ts --maxWorkers=2
          if ! command -v pdftoppm >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          for pdf in "$NEONATAL_RUJUKAN_EVIDENCE_DIR"/*.pdf; do
            prefix="${pdf%.pdf}"
            pdftoppm -png -r 110 "$pdf" "$prefix"
            pdftotext -layout "$pdf" "$prefix.txt"
            pdfinfo "$pdf" | grep '^Pages:' | sed "s|^|$(basename "$pdf"): |"
          done
      - name: Store v20 Rujukan PDF pages
        if: github.ref_name == 'feat/neonatal-v20-reference-box-20261104' || github.head_ref == 'feat/neonatal-v20-reference-box-20261104' || github.ref_name == 'fix/neonatal-v20-warning-catalog-20261104' || github.head_ref == 'fix/neonatal-v20-warning-catalog-20261104'
        uses: actions/upload-artifact@v4
        with:
          name: neonatal-v20-rujukan-pdf-pages
          path: ${{ runner.temp }}/neonatal-rujukan-evidence
          if-no-files-found: error
      - name: Browser and print preview evidence for v20 Rujukan
        if: github.ref_name == 'feat/neonatal-v20-reference-box-20261104' || github.head_ref == 'feat/neonatal-v20-reference-box-20261104' || github.ref_name == 'fix/neonatal-v20-warning-catalog-20261104' || github.head_ref == 'fix/neonatal-v20-warning-catalog-20261104'
        env:
          NEONATAL_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/neonatal-rujukan-browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          export NEONATAL_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$NEONATAL_CHROME_PATH" ]; then npx playwright install chromium; fi
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/neonatal-next-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/kalkulator > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat "$RUNNER_TEMP/neonatal-next-server.log"; exit 1; fi
          node scripts/neonatal-v20-browser-evidence.mjs
          for pdf in "$NEONATAL_BROWSER_EVIDENCE_DIR"/*-print.pdf; do
            pdftotext "$pdf" "${pdf%.pdf}.txt"
            grep -q 'Rujukan' "${pdf%.pdf}.txt"
            pdftoppm -png -r 110 "$pdf" "${pdf%.pdf}"
          done
      - name: Store v20 Rujukan browser and print evidence
        if: github.ref_name == 'feat/neonatal-v20-reference-box-20261104' || github.head_ref == 'feat/neonatal-v20-reference-box-20261104' || github.ref_name == 'fix/neonatal-v20-warning-catalog-20261104' || github.head_ref == 'fix/neonatal-v20-warning-catalog-20261104'
        uses: actions/upload-artifact@v4
        with:
          name: neonatal-v20-rujukan-browser-print
          path: ${{ runner.temp }}/neonatal-rujukan-browser
          if-no-files-found: error
