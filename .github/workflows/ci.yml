name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/fixtures/neonatal/requirements.txt
      - run: python -m pip install -r tests/fixtures/neonatal/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser acceptance for v20 renal and actual-dose screen
        if: github.ref_name == 'feat/neonatal-v20-patient-screen-20261104' || github.head_ref == 'feat/neonatal-v20-patient-screen-20261104' || github.ref_name == 'fix/neonatal-v20-evaluation-category-once-20261104' || github.head_ref == 'fix/neonatal-v20-evaluation-category-once-20261104' || github.ref_name == 'fix/neonatal-v20-reference-headings-20261106' || github.head_ref == 'fix/neonatal-v20-reference-headings-20261106' || github.ref_name == 'fix/neonatal-v20-dose-frequency-category-colors-20261106' || github.head_ref == 'fix/neonatal-v20-dose-frequency-category-colors-20261106' || github.ref_name == 'fix/neonatal-v20-validation-message-labels-20261106' || github.head_ref == 'fix/neonatal-v20-validation-message-labels-20261106' || github.ref_name == 'feat/neonatal-v20-reference-range-single-explanation-20261106' || github.head_ref == 'feat/neonatal-v20-reference-range-single-explanation-20261106' || github.ref_name == 'fix/neonatal-v20-pdf-mgkg-20261106' || github.head_ref == 'fix/neonatal-v20-pdf-mgkg-20261106' || github.ref_name == 'fix/neonatal-v20-screen-pdf-parity-20261106' || github.head_ref == 'fix/neonatal-v20-screen-pdf-parity-20261106' || github.ref_name == 'fix/neonatal-v20-pdf-datetime-20261106' || github.head_ref == 'fix/neonatal-v20-pdf-datetime-20261106' || github.ref_name == 'fix/neonatal-v20-user-facing-terms-20261106' || github.head_ref == 'fix/neonatal-v20-user-facing-terms-20261106' || github.ref_name == 'feat/neonatal-v20-evaluation-print-button-20261106' || github.head_ref == 'feat/neonatal-v20-evaluation-print-button-20261106' || github.ref_name == 'fix/neonatal-v20-print-site-navigation-20261106' || github.head_ref == 'fix/neonatal-v20-print-site-navigation-20261106' || github.ref_name == 'fix/neonatal-v20-print-expand-details-20261106' || github.head_ref == 'fix/neonatal-v20-print-expand-details-20261106'
        env:
          NEONATAL_SCREEN_EVIDENCE_DIR: ${{ runner.temp }}/neonatal-patient-screen
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          export NEONATAL_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$NEONATAL_CHROME_PATH" ]; then npx playwright install chromium; fi
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/neonatal-patient-screen-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/kalkulator > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat "$RUNNER_TEMP/neonatal-patient-screen-server.log"; exit 1; fi
          if ! command -v pdftoppm >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          node scripts/neonatal-v20-patient-screen-evidence.mjs
          for pdf in "$NEONATAL_SCREEN_EVIDENCE_DIR"/*-export.pdf; do
            prefix="${pdf%.pdf}"
            pdftotext -layout "$pdf" "$prefix.txt"
            grep -Fq "Fungsi ginjal" "$prefix.txt"
            grep -Fq "Cara membaca rujukan" "$prefix.txt"
            grep -Fq "mg/kg" "$prefix.txt"
            grep -Fq "Dibuat lokal:" "$prefix.txt"
            grep -Eq "pukul [0-9]{2}\\.[0-9]{2}\\.[0-9]{2}" "$prefix.txt"
            grep -Fq "Tidak ada kondisi klinis tambahan yang dipilih" "$prefix.txt"
            if grep -Eiq '(notebook|modifier|kalkulator v20|sumber dan batas aturan produksi)' "$prefix.txt"; then
              echo "Istilah lama ditemukan dalam PDF ekspor: $pdf"
              exit 1
            fi
            pdftoppm -png -r 105 "$pdf" "$prefix"
            pdfinfo "$pdf" | grep '^Pages:' | sed "s|^|$(basename "$pdf"): |"
          done
          for pdf in "$NEONATAL_SCREEN_EVIDENCE_DIR"/*-print.pdf; do
            prefix="${pdf%.pdf}"
            pdftotext -layout "$pdf" "$prefix.txt"
            grep -q "Fungsi ginjal" "$prefix.txt"
            grep -Fq "Australasian Neonatal Medicines Formulary" "$prefix.txt"
            if [[ "$pdf" == *"-recommendation-print.pdf" ]]; then
              grep -Fq "Catatan kualitatif saja" "$prefix.txt"
              grep -Fq "Rekomendasi disusun berdasarkan sumber rujukan yang tercantum" "$prefix.txt"
            fi
            if grep -Eiq 'Lewati navigasi|Beranda|Cari Obat|Tentang Kami|Login|Jelajahi' "$prefix.txt"; then
              echo "Menu situs masih tercetak di PDF: $pdf"
              exit 1
            fi
            if [[ "$pdf" == *"-evaluation-print.pdf" || "$pdf" == *"-evaluation-mobile-print.pdf" ]]; then
              grep -Fq "Evaluasi Pemberian" "$prefix.txt"
              grep -q "mg/kg" "$prefix.txt"
              grep -q "Pedoman Rumah Sakit" "$prefix.txt"
              grep -Fq "Literatur Terkini (ANMF 2024)" "$prefix.txt"
              grep -Fq "Cara membaca rujukan" "$prefix.txt"
            fi
            pdftoppm -png -r 110 "$pdf" "$prefix"
            pdfinfo "$pdf" | grep '^Pages:' | sed "s|^|$(basename "$pdf"): |"
          done
      - name: Store v20 renal and actual-dose screen evidence
        if: github.ref_name == 'feat/neonatal-v20-patient-screen-20261104' || github.head_ref == 'feat/neonatal-v20-patient-screen-20261104' || github.ref_name == 'fix/neonatal-v20-evaluation-category-once-20261104' || github.head_ref == 'fix/neonatal-v20-evaluation-category-once-20261104' || github.ref_name == 'fix/neonatal-v20-reference-headings-20261106' || github.head_ref == 'fix/neonatal-v20-reference-headings-20261106' || github.ref_name == 'fix/neonatal-v20-dose-frequency-category-colors-20261106' || github.head_ref == 'fix/neonatal-v20-dose-frequency-category-colors-20261106' || github.ref_name == 'fix/neonatal-v20-validation-message-labels-20261106' || github.head_ref == 'fix/neonatal-v20-validation-message-labels-20261106' || github.ref_name == 'feat/neonatal-v20-reference-range-single-explanation-20261106' || github.head_ref == 'feat/neonatal-v20-reference-range-single-explanation-20261106' || github.ref_name == 'fix/neonatal-v20-pdf-mgkg-20261106' || github.head_ref == 'fix/neonatal-v20-pdf-mgkg-20261106' || github.ref_name == 'fix/neonatal-v20-screen-pdf-parity-20261106' || github.head_ref == 'fix/neonatal-v20-screen-pdf-parity-20261106' || github.ref_name == 'fix/neonatal-v20-pdf-datetime-20261106' || github.head_ref == 'fix/neonatal-v20-pdf-datetime-20261106' || github.ref_name == 'fix/neonatal-v20-user-facing-terms-20261106' || github.head_ref == 'fix/neonatal-v20-user-facing-terms-20261106' || github.ref_name == 'feat/neonatal-v20-evaluation-print-button-20261106' || github.head_ref == 'feat/neonatal-v20-evaluation-print-button-20261106' || github.ref_name == 'fix/neonatal-v20-print-site-navigation-20261106' || github.head_ref == 'fix/neonatal-v20-print-site-navigation-20261106' || github.ref_name == 'fix/neonatal-v20-print-expand-details-20261106' || github.head_ref == 'fix/neonatal-v20-print-expand-details-20261106'
        uses: actions/upload-artifact@v4
        with:
          name: neonatal-v20-patient-screen-browser-print
          path: ${{ runner.temp }}/neonatal-patient-screen
          if-no-files-found: error
      - run: npm run test:neonatal:v20 -- --maxWorkers=2
      - name: Browser acceptance v20 checkbox labels and reasonable input bounds
        if: github.ref_name == 'feat/neonatal-v20-checkbox-guidance-20261104' || github.head_ref == 'feat/neonatal-v20-checkbox-guidance-20261104'
        env:
          NEONATAL_CHECKBOX_EVIDENCE_DIR: ${{ runner.temp }}/neonatal-checkbox-v20-evidence
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          export NEONATAL_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$NEONATAL_CHROME_PATH" ]; then npx playwright install chromium; fi
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/neonatal-checkbox-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/kalkulator > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat "$RUNNER_TEMP/neonatal-checkbox-server.log"; exit 1; fi
          node scripts/neonatal-v20-checkbox-evidence.mjs
      - name: Store v20 checkbox browser evidence
        if: github.ref_name == 'feat/neonatal-v20-checkbox-guidance-20261104' || github.head_ref == 'feat/neonatal-v20-checkbox-guidance-20261104'
        uses: actions/upload-artifact@v4
        with:
          name: neonatal-v20-checkbox-browser
          path: ${{ runner.temp }}/neonatal-checkbox-v20-evidence
          if-no-files-found: error
      - name: Render v20 Rujukan PDF evidence (every page)
        if: github.ref_name == 'feat/neonatal-v20-reference-box-20261104' || github.head_ref == 'feat/neonatal-v20-reference-box-20261104' || github.ref_name == 'fix/neonatal-v20-warning-catalog-20261104' || github.head_ref == 'fix/neonatal-v20-warning-catalog-20261104' || github.ref_name == 'test/neonatal-v20-renal-notes-20261104' || github.head_ref == 'test/neonatal-v20-renal-notes-20261104' || github.ref_name == 'test/neonatal-v20-combined-therapy-20261104' || github.head_ref == 'test/neonatal-v20-combined-therapy-20261104' || github.ref_name == 'fix/neonatal-v20-pdf-mgkg-20261106' || github.head_ref == 'fix/neonatal-v20-pdf-mgkg-20261106' || github.ref_name == 'fix/neonatal-v20-screen-pdf-parity-20261106' || github.head_ref == 'fix/neonatal-v20-screen-pdf-parity-20261106' || github.ref_name == 'fix/neonatal-v20-pdf-datetime-20261106' || github.head_ref == 'fix/neonatal-v20-pdf-datetime-20261106' || github.ref_name == 'fix/neonatal-v20-user-facing-terms-20261106' || github.head_ref == 'fix/neonatal-v20-user-facing-terms-20261106' || github.ref_name == 'feat/neonatal-v20-evaluation-print-button-20261106' || github.head_ref == 'feat/neonatal-v20-evaluation-print-button-20261106' || github.ref_name == 'fix/neonatal-v20-print-site-navigation-20261106' || github.head_ref == 'fix/neonatal-v20-print-site-navigation-20261106' || github.ref_name == 'fix/neonatal-v20-print-expand-details-20261106' || github.head_ref == 'fix/neonatal-v20-print-expand-details-20261106'
        env:
          NEONATAL_RUJUKAN_EVIDENCE_DIR: ${{ runner.temp }}/neonatal-rujukan-evidence
        run: |
          mkdir -p "$NEONATAL_RUJUKAN_EVIDENCE_DIR"
          npx vitest run src/lib/neonatal-calculator/__tests__/report-exports.test.ts --maxWorkers=2
          if ! command -v pdftoppm >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          for pdf in "$NEONATAL_RUJUKAN_EVIDENCE_DIR"/*.pdf; do
            prefix="${pdf%.pdf}"
            pdftoppm -png -r 110 "$pdf" "$prefix"
            pdftotext -layout "$pdf" "$prefix.txt"
            grep -Fq "Fungsi ginjal" "$prefix.txt"
            grep -Fq "Cara membaca rujukan" "$prefix.txt"
            grep -Fq "Dibuat lokal:" "$prefix.txt"
            grep -Eq "pukul [0-9]{2}\\.[0-9]{2}\\.[0-9]{2}" "$prefix.txt"
            grep -Fq "Tidak ada kondisi klinis tambahan yang dipilih" "$prefix.txt"
            if grep -Eiq '(notebook|modifier|kalkulator v20|sumber dan batas aturan produksi)' "$prefix.txt"; then
              echo "Istilah lama ditemukan dalam PDF acuan: $pdf"
              exit 1
            fi
            if [[ "$pdf" == *"-rekomendasi.pdf" || "$pdf" == *"-evaluasi.pdf" ]]; then
              grep -Fq "mg/kg per pemberian" "$prefix.txt"
            fi
            if [[ "$pdf" == *"-evaluasi.pdf" ]]; then
              grep -Fq "Dosis aktual:" "$prefix.txt"
            fi
            pdfinfo "$pdf" | grep '^Pages:' | sed "s|^|$(basename "$pdf"): |"
          done
      - name: Store v20 Rujukan PDF pages
        if: github.ref_name == 'feat/neonatal-v20-reference-box-20261104' || github.head_ref == 'feat/neonatal-v20-reference-box-20261104' || github.ref_name == 'fix/neonatal-v20-warning-catalog-20261104' || github.head_ref == 'fix/neonatal-v20-warning-catalog-20261104' || github.ref_name == 'test/neonatal-v20-renal-notes-20261104' || github.head_ref == 'test/neonatal-v20-renal-notes-20261104' || github.ref_name == 'test/neonatal-v20-combined-therapy-20261104' || github.head_ref == 'test/neonatal-v20-combined-therapy-20261104' || github.ref_name == 'fix/neonatal-v20-pdf-mgkg-20261106' || github.head_ref == 'fix/neonatal-v20-pdf-mgkg-20261106' || github.ref_name == 'fix/neonatal-v20-screen-pdf-parity-20261106' || github.head_ref == 'fix/neonatal-v20-screen-pdf-parity-20261106' || github.ref_name == 'fix/neonatal-v20-pdf-datetime-20261106' || github.head_ref == 'fix/neonatal-v20-pdf-datetime-20261106' || github.ref_name == 'fix/neonatal-v20-user-facing-terms-20261106' || github.head_ref == 'fix/neonatal-v20-user-facing-terms-20261106' || github.ref_name == 'feat/neonatal-v20-evaluation-print-button-20261106' || github.head_ref == 'feat/neonatal-v20-evaluation-print-button-20261106' || github.ref_name == 'fix/neonatal-v20-print-site-navigation-20261106' || github.head_ref == 'fix/neonatal-v20-print-site-navigation-20261106' || github.ref_name == 'fix/neonatal-v20-print-expand-details-20261106' || github.head_ref == 'fix/neonatal-v20-print-expand-details-20261106'
        uses: actions/upload-artifact@v4
        with:
          name: neonatal-v20-rujukan-pdf-pages
          path: ${{ runner.temp }}/neonatal-rujukan-evidence
          if-no-files-found: error
      - name: Browser and print preview evidence for v20 Rujukan
        if: github.ref_name == 'feat/neonatal-v20-reference-box-20261104' || github.head_ref == 'feat/neonatal-v20-reference-box-20261104' || github.ref_name == 'fix/neonatal-v20-warning-catalog-20261104' || github.head_ref == 'fix/neonatal-v20-warning-catalog-20261104' || github.ref_name == 'test/neonatal-v20-renal-notes-20261104' || github.head_ref == 'test/neonatal-v20-renal-notes-20261104' || github.ref_name == 'test/neonatal-v20-combined-therapy-20261104' || github.head_ref == 'test/neonatal-v20-combined-therapy-20261104'
        env:
          NEONATAL_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/neonatal-rujukan-browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          export NEONATAL_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$NEONATAL_CHROME_PATH" ]; then npx playwright install chromium; fi
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/neonatal-next-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/kalkulator > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then cat "$RUNNER_TEMP/neonatal-next-server.log"; exit 1; fi
          node scripts/neonatal-v20-browser-evidence.mjs
          for pdf in "$NEONATAL_BROWSER_EVIDENCE_DIR"/*-print.pdf; do
            pdftotext "$pdf" "${pdf%.pdf}.txt"
            grep -q 'Rujukan' "${pdf%.pdf}.txt"
            pdftoppm -png -r 110 "$pdf" "${pdf%.pdf}"
          done
      - name: Store v20 Rujukan browser and print evidence
        if: github.ref_name == 'feat/neonatal-v20-reference-box-20261104' || github.head_ref == 'feat/neonatal-v20-reference-box-20261104' || github.ref_name == 'fix/neonatal-v20-warning-catalog-20261104' || github.head_ref == 'fix/neonatal-v20-warning-catalog-20261104' || github.ref_name == 'test/neonatal-v20-renal-notes-20261104' || github.head_ref == 'test/neonatal-v20-renal-notes-20261104' || github.ref_name == 'test/neonatal-v20-combined-therapy-20261104' || github.head_ref == 'test/neonatal-v20-combined-therapy-20261104'
        uses: actions/upload-artifact@v4
        with:
          name: neonatal-v20-rujukan-browser-print
          path: ${{ runner.temp }}/neonatal-rujukan-browser
          if-no-files-found: error
